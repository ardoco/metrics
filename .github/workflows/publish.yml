name: Deploy to GitHub
on:
    workflow_dispatch:
    release:
        types: [ created ]
jobs:
    publish-release-artifact:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Determine Java version
                id: jve
                shell: bash
                run: |
                  for expr in maven.compiler.target maven.compiler.release java.version; do
                    v=$(mvn -B -q -N help:evaluate -DforceStdout -Dexpression="$expr" 2>/dev/null || true)
                    v=${v#1.}
                    if [[ "$v" =~ ^[0-9]+ ]]; then
                      echo "java_major_version=${BASH_REMATCH[0]}" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                  done
                  echo "::error::Could not determine the Java version from the POM"
                  exit 1

            -   name: Java without Cache
                uses: actions/setup-java@v4
                with:
                    java-version: ${{ steps.jve.outputs.java_major_version }}
                    distribution: 'temurin'

            -   name: Build Metrics
                run: mvn -U -B clean package

            -   name: Attach CLI to Release on GitHub
                uses: softprops/action-gh-release@v2
                with:
                    files: cli/target/metrics-cli.jar
                    fail_on_unmatched_files: true
