name: Docker Push

on:
    workflow_dispatch:
    # Monthly rebuild: images use the floating eclipse-temurin:25 tag and pick up JDK patches only when rebuilt
    schedule:
        - cron: "37 4 25 * *"
    push:
        # Publish `main` as Docker `latest` image.
        branches:
            - main
        paths-ignore:
            - '**.md'
            - '.github/**'

        # Publish `v1.2.3` tags as releases.
        tags:
            - v*

jobs:
    push:
        uses: ardoco/actions/.github/workflows/docker.yml@main
        with:
            image-name: metrics
            push: true
