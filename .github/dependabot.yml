version: 2
updates:
    -   package-ecosystem: "maven"
        directory: "/"
        schedule:
            interval: "monthly"
            time: "11:00"
            timezone: "Europe/Berlin"
        commit-message:
            prefix: "Dependency"
            include: "scope"
    -   package-ecosystem: "docker"
        directory: "/"
        schedule:
            interval: "monthly"
            time: "11:00"
            timezone: "Europe/Berlin"
        commit-message:
            prefix: "Dependency"
            include: "scope"
        # ARDoCo only uses Java LTS versions (25, next 29): no non-LTS JDK images
        ignore:
            - dependency-name: "eclipse-temurin"
              versions: [">= 26, < 29"]
            - dependency-name: "eclipse-temurin"
              update-types: ["version-update:semver-major"]
            - dependency-name: "maven"
              versions: [">= 26, < 29"]
            - dependency-name: "maven"
              update-types: ["version-update:semver-major"]
